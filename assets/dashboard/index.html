<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude Code Display Plugin</title>
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
<link rel="icon" type="image/png" sizes="256x256" href="/static/favicon.png">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<main>
  <section id="gate" class="gatecard hidden"></section>

  <section class="surfaces">
    <div class="shead">
      <h2>Displays</h2>
      <span id="bugcount" class="muted"></span>
    </div>
    <div id="grid" class="grid"></div>
    <p id="empty" class="muted">No displays yet. Open a project in a Claude Code session and use the
       display tools, or they'll appear here automatically.</p>
  </section>

  <!-- what the sessions have said back: bug reports and feedback -->
  <section class="reports">
    <div class="shead">
      <h2>From the sessions</h2>
      <span id="rcount" class="muted"></span>
      <span class="grow"></span>
      <button id="rtoggle" class="btn sm">Show</button>
    </div>
    <div id="rlist" class="rlist hidden"></div>
  </section>
</main>

<template id="tile">
  <div class="tile">
    <div class="thead">
      <span class="dpy"></span>
      <span class="grow"></span>
      <span class="pss"></span>
    </div>
    <div class="view"><img class="stream" alt="live display"></div>
    <div class="path"></div>
    <div class="actions">
      <button class="btn sm icon expand" title="Fullscreen (view only)"></button>
      <button class="btn sm control">Control display</button>
      <button class="btn sm recover" title="Unstick this display: dismiss menus, refocus the browser, force a repaint">Recover</button>
      <span class="grow"></span>
      <button class="btn sm danger close">Close</button>
    </div>
  </div>
</template>

<!-- in-window fullscreen (view) / control (noVNC) stage -->
<div id="stage" class="stage hidden">
  <div class="stageview">
    <img id="stageimg" alt="display">
    <iframe id="stageframe" class="hidden" title="control"></iframe>
  </div>
  <button id="stagetoggle" class="btn sm icon stagebtn" title="Exit fullscreen"></button>
</div>

<script src="/static/app.js"></script>
</body>
</html>
